micronaut:
  application:
    name: security-service
  metrics:
    enabled: true
    export:
      prometheus:
        enabled: true
        descriptions: true
        step: PT10S
  server:
    cors:
      enabled: true
      configurations:
        # the meme gallery UI (served by microservice-memes) signs users in against this service;
        # 4200 is security's own UI on its dev server (the specs' third entry point); 8093 is the
        # collections UI (react-native-web — its separate origin is what exercises CORS) and 5173
        # its Vite dev server
        ui:
          # EXPLICIT since Micronaut 5, which flipped the default from true to false. Every one of
          # these origins sends its sign-in with credentials: 'include' (the refresh cookie), and a
          # browser refuses such a response unless it carries
          # Access-Control-Allow-Credentials: true - so with the default flipped, the preflight
          # still answered 200 with a correct Allow-Origin and the request was blocked anyway.
          # Nothing server-side logs a thing: the service never sees the POST.
          #
          # This is why it is written down rather than left to a default: the value the browser
          # needs is not the framework's idea of a safe default, and the two disagreeing is
          # invisible to every test that does not use a real browser.
          allow-credentials: true
          # A LIST FROM ONE PROPERTY, so a deployment can replace it whole. The defaults are the
          # compose origins and stay the defaults; anything else - a k3s ingress, a hosted domain -
          # sets SECURITY_CORS_ORIGINS to its own comma-separated list. Hard-coding the list made
          # the service un-deployable anywhere but this laptop, and the failure it produces is the
          # silent client-side one this file's comment above describes.
          allowed-origins: ${SECURITY_CORS_ORIGINS:`http://localhost:8083,http://localhost:8084,http://localhost:4200,http://localhost:8093,http://localhost:5173`}
security:
  # The layered configuration ladder (shared/config, wired in BeanFactory#minPasswordLength):
  # a security_settings database row (runtime — live within one cache TTL) beats a property set
  # here (deployment — needs a restart) beats the hardcoded default (compile time). Both keys are
  # deliberately ABSENT below: an absent property is a VACANT rung, not zero — the hardcoded
  # default (MinLength.DEFAULT = 5, TTL 10 s) answers until a deployment or an administrator says
  # otherwise. Setting a value here (or the equivalent env var) claims the deployment rung.
  #
  # password.policy.min.length: 12
  # settings.cache.ttl.seconds: 10   # zero switches the settings cache off. The TTL has NO
  #                                  # database rung ON PURPOSE: meta-configuration lives one
  #                                  # rung below what it governs, or a bad TTL (say 24h) would
  #                                  # delay the very correction that fixes it by 24h.
  #
  # The email policy for registration lives on the deployment rung only (BeanFactory#emailPolicy):
  # comma-separated domain lists, each ABSENT by default, so no email rule is in force until a
  # deployment says so. A rejection carries the policy back, so a client can name the company
  # domains an employee may register from.
  #
  # email.blocked.domains: example.org,spam.example
  # email.disposable.domains: mailinator.com
  # email.company.domains: acme.com        # a closed shop: only these domains may register
  saga:
    # The saga-listener lamp's stall tolerance, wired to an environment variable ON PURPOSE rather
    # than left to the @Value default. OffboardingListenerHealth refuses to start on a value below
    # its floor and tells the operator to "raise it or leave it unset" — naming
    # SECURITY_LISTENER_STALL_SEC. Until this line existed that variable was read by NOTHING: the
    # value came from the property below, so an operator who followed the message set a variable
    # that changed nothing and saw the very same refusal. The twins already do it this way
    # (memes MEMES_LISTENER_STALL_SEC, comments COMMENTS_LISTENER_STALL_SEC); the default here
    # matches the one in the @Value annotation, so behaviour is unchanged when the variable is unset.
    listener-stall-seconds: ${SECURITY_LISTENER_STALL_SEC:120}
endpoints:
  health:
    enabled: true
    sensitive: false
  # scraped by the workspace's Prometheus (observability/prometheus.yml); metrics carry no
  # secrets — request timings, JVM vitals, connection pools
  prometheus:
    enabled: true
    sensitive: false
# Links carried by the verification / password-reset mails; the mails themselves travel as events
# (transactional outbox -> Kafka `mail-requests` -> microservice-email).
email-service:
  verify-link-base: ${VERIFY_LINK_BASE:`http://localhost:8080/verify-email?token=`}
  reset-link-base: ${RESET_LINK_BASE:`http://localhost:8080/reset-password?token=`}
kafka:
  bootstrap:
    servers: ${KAFKA_BOOTSTRAP_SERVERS:`localhost:9092`}
  health:
    # OFF, and this is a decision about what readiness MEANS for identity, not a convenience.
    #
    # micronaut-kafka contributes a cluster probe, and Micronaut puts every indicator without
    # @Liveness into the READINESS group. Since the k8s manifest and the compose healthcheck ask
    # /health/readiness, that made a broker blip answer "do not send me traffic" — pulling sign-in,
    # refresh and token introspection out of the Service FOR BOTH PRODUCTS, over a fault that has
    # nothing to do with signing in. A broker slow to start would fail the startupProbe outright and
    # crash-loop the identity service. Measured, not argued: booted against a dead broker,
    # /health/readiness answers 503 with `kafka DOWN` while OffboardingListenerHealth says UP.
    #
    # It is also the exact outcome OffboardingListenerHealth's own javadoc declares excluded ("this
    # is deliberately NOT a broker probe... red-lighting identity because Kafka blinked would take
    # sign-in away from both products"). That sentence is about the lamp; this line is what makes it
    # true of the whole group.
    #
    # What still watches Kafka: the lamp, which reports THIS service's listener rather than the
    # cluster, and the participants whose loops genuinely depend on the broker
    # (comments/memes/user-collections/offboarding) — each red-lighting only itself.
    enabled: false
