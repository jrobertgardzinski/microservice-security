micronaut:
  application:
    name: security-service
  metrics:
    enabled: true
    export:
      prometheus:
        enabled: true
        descriptions: true
        step: PT10S
  server:
    cors:
      enabled: true
      configurations:
        # the meme gallery UI (served by microservice-memes) signs users in against this service;
        # 4200 is security's own UI on its dev server (the specs' third entry point); 8093 is the
        # collections UI (react-native-web — its separate origin is what exercises CORS) and 5173
        # its Vite dev server
        ui:
          # EXPLICIT since Micronaut 5, which flipped the default from true to false. Every one of
          # these origins sends its sign-in with credentials: 'include' (the refresh cookie), and a
          # browser refuses such a response unless it carries
          # Access-Control-Allow-Credentials: true - so with the default flipped, the preflight
          # still answered 200 with a correct Allow-Origin and the request was blocked anyway.
          # Nothing server-side logs a thing: the service never sees the POST.
          #
          # This is why it is written down rather than left to a default: the value the browser
          # needs is not the framework's idea of a safe default, and the two disagreeing is
          # invisible to every test that does not use a real browser.
          allow-credentials: true
          # A LIST FROM ONE PROPERTY, so a deployment can replace it whole. The defaults are the
          # compose origins and stay the defaults; anything else - a k3s ingress, a hosted domain -
          # sets SECURITY_CORS_ORIGINS to its own comma-separated list. Hard-coding the list made
          # the service un-deployable anywhere but this laptop, and the failure it produces is the
          # silent client-side one this file's comment above describes.
          allowed-origins: ${SECURITY_CORS_ORIGINS:`http://localhost:8083,http://localhost:8084,http://localhost:4200,http://localhost:8093,http://localhost:5173`}
endpoints:
  health:
    enabled: true
    sensitive: false
  # scraped by the workspace's Prometheus (observability/prometheus.yml); metrics carry no
  # secrets — request timings, JVM vitals, connection pools
  prometheus:
    enabled: true
    sensitive: false
# Links carried by the verification / password-reset mails; the mails themselves travel as events
# (transactional outbox -> Kafka `mail-requests` -> microservice-email).
email-service:
  verify-link-base: ${VERIFY_LINK_BASE:`http://localhost:8080/verify-email?token=`}
  reset-link-base: ${RESET_LINK_BASE:`http://localhost:8080/reset-password?token=`}
kafka:
  bootstrap:
    servers: ${KAFKA_BOOTSTRAP_SERVERS:`localhost:9092`}
